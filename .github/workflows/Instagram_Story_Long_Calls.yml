name: Instagram Story - Long Calls

on:
  workflow_dispatch: {}  # DISABLED: legacy workflow - manual trigger only

jobs:
  post_long_calls_story:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Restore Instagram session from cache
      id: session-cache
      uses: actions/cache@v3
      with:
        path: |
          data/instagram_session.json
          sessions/instagram_session.json
        key: instagram-session-${{ secrets.INSTAGRAM_USERNAME }}-v1
        restore-keys: |
          instagram-session-${{ secrets.INSTAGRAM_USERNAME }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-dotenv requests
        playwright install chromium
      env:
        PYTHONIOENCODING: utf-8

    - name: Ensure Instagram session exists
      run: python scripts/auth/ensure_session.py
      env:
        PYTHONIOENCODING: utf-8
        INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
        INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}

    - name: Post Long Calls Story
      run: python scripts/main/publishing/post_long_calls_story.py
      env:
        PYTHONIOENCODING: utf-8
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
        INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}

    - name: Upload story artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instagram-long-calls-story-output
        path: |
          output_html/long_calls_story_output.html
          output_images/long_calls_story_output.jpg
        retention-days: 7
